<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            width: 500px;
            height: 404px;
            background-color: #07182e;
            position: relative;
            display: flex;
            place-content: center;
            place-items: center;
            overflow: hidden;
            border-radius: 20px;
            margin-left: 30%;
            margin-top: 5%;
        }
        .card h2{
            z-index: 1;
            color: white;
            font-size: 4em;
            background: #5b3ffb;
background: radial-gradient(circle,rgba(91, 63, 251, 1) 41%, rgba(231, 69, 126, 1) 79%, rgba(252, 70, 107, 1) 100%);
            background-clip: text;
            
            color: transparent;


        }
        .card::before{
            content: '';
            position: absolute;
            width: 100px;
            background-image: linear-gradient(180deg,red,blue, rgb(0,183,255),rgb(255,48,255));
            height: 130%;
            animation: rotBGimg 4s linear infinite;
            transition: all 0.25 linear;

        }
        @keyframes rotBGimg{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
        .card::after{
            content: "";
            position: absolute;
            background-color: #07182e;
            inset: 5px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Shalni Singh</h2>
    </div>
</body>
</html>
